# Nginx site for the walkMe API. Replace __DOMAIN__ (setup-nginx.sh does it for you).
# Certbot adds the HTTPS server block to this file automatically.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Uploads are capped at 10 MB by multer; leave a little headroom.
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        # WebSocket upgrade for Socket.io (without these it silently falls back to polling)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
