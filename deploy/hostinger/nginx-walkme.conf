# Nginx site for the walkMe API + admin panel. Replace __DOMAIN__ and
# __REPO_ROOT__ (setup-nginx.sh does both for you).
# Certbot adds the HTTPS server block to this file automatically.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Uploads are capped at 10 MB by multer; leave a little headroom.
    client_max_body_size 12m;

    # Admin panel — static files built by `deploy.sh` (no PM2 process; it's
    # just a React SPA). Falls back to index.html for client-side routing.
    location /admin/ {
        alias __REPO_ROOT__/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        # WebSocket upgrade for Socket.io (without these it silently falls back to polling)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
    }
}
